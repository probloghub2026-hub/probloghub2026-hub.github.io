<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Tools For Business | NOVA AI STUDIO</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:
    radial-gradient(circle at top left,#312e81 0%,transparent 25%),
    radial-gradient(circle at top right,#0f766e 0%,transparent 25%),
    radial-gradient(circle at bottom,#7c3aed 0%,transparent 20%),
    #020617;
    color:white;
    overflow-x:hidden;
}

/* SCROLLBAR */

::-webkit-scrollbar{
    width:10px;
}

::-webkit-scrollbar-thumb{
    background:linear-gradient(#7c3aed,#06b6d4);
    border-radius:20px;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(2,6,23,0.8);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,0.08);
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:30px;
    font-weight:800;
    background:linear-gradient(90deg,#38bdf8,#8b5cf6,#06b6d4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.header-btn{
    padding:14px 26px;
    border-radius:16px;
    background:linear-gradient(135deg,#8b5cf6,#2563eb);
    color:white;
    text-decoration:none;
    font-weight:700;
    transition:0.3s;
}

.header-btn:hover{
    transform:translateY(-4px);
}

/* HERO */

.hero{
    padding:120px 7% 90px;
    text-align:center;
}

.hero h1{
    font-size:72px;
    line-height:1.1;
    margin-bottom:25px;
}

.hero h1 span{
    background:linear-gradient(90deg,#38bdf8,#8b5cf6);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.hero p{
    max-width:900px;
    margin:auto;
    font-size:20px;
    line-height:1.9;
    color:#cbd5e1;
}

/* SEARCH */

.search-area{
    padding:0 7%;
    margin-top:-30px;
}

.search-box{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.12);
    backdrop-filter:blur(20px);
    border-radius:24px;
    padding:22px 28px;
    box-shadow:0 20px 50px rgba(0,0,0,0.45);
}

.search-box input{
    width:100%;
    border:none;
    outline:none;
    background:transparent;
    color:white;
    font-size:18px;
    font-family:Poppins;
}

.search-box input::placeholder{
    color:#cbd5e1;
}

/* GRID */

.container{
    padding:70px 7% 100px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(290px,1fr));
    gap:30px;
}

/* CARD */

.card{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);
    border-radius:30px;
    overflow:hidden;
    transition:0.4s;
    position:relative;
}

.card:hover{
    transform:translateY(-12px);
    border-color:#38bdf8;
    box-shadow:0 25px 60px rgba(0,0,0,0.45);
}

.card-top{
    padding:30px;
}

.icon{
    width:78px;
    height:78px;
    border-radius:22px;
    background:linear-gradient(135deg,#06b6d4,#8b5cf6);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    margin-bottom:22px;
}

.card h3{
    font-size:25px;
    margin-bottom:12px;
}

.card p{
    color:#cbd5e1;
    line-height:1.8;
    font-size:15px;
    min-height:100px;
}

.tag{
    display:inline-block;
    margin-top:18px;
    background:rgba(255,255,255,0.08);
    color:#38bdf8;
    padding:8px 16px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
}

.visit-btn{
    display:block;
    margin:0 30px 30px;
    text-align:center;
    padding:15px;
    border-radius:18px;
    text-decoration:none;
    color:white;
    font-weight:700;
    background:linear-gradient(135deg,#8b5cf6,#2563eb);
    transition:0.3s;
}

.visit-btn:hover{
    transform:scale(1.04);
}

/* FOOTER */

footer{
    padding:45px 20px;
    text-align:center;
    border-top:1px solid rgba(255,255,255,0.08);
    color:#94a3b8;
}

/* MOBILE */

@media(max-width:768px){

.hero h1{
    font-size:44px;
}

header{
    flex-direction:column;
    gap:18px;
}

.grid{
    grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
NOVA AI STUDIO
</div>

<a href="index.html" class="header-btn">
Back To Store
</a>

let grid = document.getElementById("toolsGrid");

tools.forEach(tool=>{

grid.innerHTML += `

<div class="card">

<div class="card-top">

<div class="icon">${tool[0]}</div>

<h3>${tool[1]}</h3>

<p>${tool[2]}</p>

<div class="tag">${tool[4]}</div>

</div>

<a href="${tool[3]}" target="_blank" class="visit-btn">
Visit Tool
</a>

</div>

`;

});

function searchTools(){

let input = document.getElementById("searchInput").value.toLowerCase();

let cards = document.querySelectorAll(".card");

cards.forEach(card=>{

let text = card.innerText.toLowerCase();

if(text.includes(input)){
card.style.display = "block";
}
else{
card.style.display = "none";
}

});

}

</script>

</div>

</div>

<footer>

</footer>

</body>
</html>
