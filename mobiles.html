<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Mobiles Store</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f5f5f5;
}

/* HEADER */

header{
background:#111;
padding:15px 25px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:1000;
}

.logo{
color:white;
font-size:30px;
font-weight:bold;
}

.home-btn{
padding:12px 25px;
border:none;
border-radius:12px;
background:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

/* HERO */

.hero{
height:420px;
background:url('https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=1400&auto=format&fit=crop') center/cover;
display:flex;
justify-content:center;
align-items:center;
font-size:55px;
font-weight:bold;
color:white;
text-align:center;
padding:20px;
}

/* SEARCH */

.search-box{
padding:25px;
text-align:center;
background:white;
}

.search-box input{
width:90%;
max-width:650px;
padding:16px;
font-size:20px;
border:none;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,0.15);
outline:none;
}

/* CATEGORY */

.categories{
display:flex;
gap:15px;
overflow:auto;
padding:20px;
background:white;
}

.categories button{
padding:12px 22px;
border:none;
border-radius:12px;
background:black;
color:white;
font-size:17px;
cursor:pointer;
white-space:nowrap;
}

/* MOBILE GRID */

.mobile-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
padding:25px;
}

/* CARD */

.mobile-card{
background:white;
border-radius:22px;
padding:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
transition:0.3s;
cursor:pointer;
}

.mobile-card:hover{
transform:translateY(-8px);
}

.mobile-card img{
width:100%;
height:240px;
object-fit:contain;
}

.mobile-card h2{
margin-top:15px;
font-size:22px;
}

.mobile-card p{
margin-top:8px;
color:gray;
font-size:18px;
}

/* DETAILS */

.details-page{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:white;
overflow:auto;
display:none;
padding:30px;
z-index:2000;
}

.details-box{
max-width:1000px;
margin:auto;
text-align:center;
}

.details-box img{
width:350px;
max-width:100%;
}

.details-box h1{
margin-top:20px;
font-size:42px;
}

.details-box h2{
margin-top:15px;
font-size:32px;
}

.details-box p{
margin-top:15px;
font-size:20px;
line-height:1.7;
color:#444;
}

.buy-btn{
display:inline-block;
margin-top:25px;
padding:16px 40px;
background:black;
color:white;
text-decoration:none;
font-size:22px;
border-radius:15px;
}

.close-btn{
padding:12px 25px;
background:red;
color:white;
border:none;
border-radius:12px;
font-size:18px;
cursor:pointer;
margin-bottom:25px;
}

/* MOBILE */

@media(max-width:700px){

.hero{
font-size:35px;
height:320px;
}

.logo{
font-size:24px;
}

.mobile-card img{
height:190px;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
Top Mobile Store
</div>

<a href="index.html">
<button class="home-btn">
Home
</button>
</a>

</header>

<div class="hero">
Discover Top Smartphones 2026
</div>

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search Any Mobile..."
>

</div>

<div class="categories">

<button onclick="filterBrand('All')">All</button>

<button onclick="filterBrand('iPhone')">iPhone</button>

<button onclick="filterBrand('Samsung')">Samsung</button>

<button onclick="filterBrand('Xiaomi')">Xiaomi</button>

<button onclick="filterBrand('Realme')">Realme</button>

<button onclick="filterBrand('Vivo')">Vivo</button>

<button onclick="filterBrand('Oppo')">Oppo</button>

<button onclick="filterBrand('Infinix')">Infinix</button>

<button onclick="filterBrand('Tecno')">Tecno</button>

</div>

<div class="mobile-grid" id="mobileGrid"></div>

<!-- DETAILS PAGE -->

<div class="details-page" id="detailsPage">

<button class="close-btn" onclick="closeDetails()">
Back
</button>

<div class="details-box" id="detailsBox"></div>

</div>

<script>

/* MOBILE DATABASE */

const mobiles = [

{
name:"iPhone 15 Pro Max",
brand:"iPhone",
price:"$1199",
image:"https://images.unsplash.com/photo-1695048133142-1a20484d2569?q=80&w=1000&auto=format&fit=crop",
details:"A17 Pro chip, Titanium body, 48MP Camera, Super Retina Display.",
buy:"https://www.amazon.com/s?k=iphone+15+pro+max"
},

{
name:"Samsung Galaxy S24 Ultra",
brand:"Samsung",
price:"$1299",
image:"https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?q=80&w=1000&auto=format&fit=crop",
details:"200MP Camera, Galaxy AI, Snapdragon processor.",
buy:"https://www.amazon.com/s?k=s24+ultra"
},

{
name:"Xiaomi 14 Ultra",
brand:"Xiaomi",
price:"$999",
image:"https://images.unsplash.com/photo-1598327105666-5b89351aff97?q=80&w=1000&auto=format&fit=crop",
details:"Leica camera system with flagship performance.",
buy:"https://www.amazon.com/s?k=xiaomi+14+ultra"
},

{
name:"Realme GT 6",
brand:"Realme",
price:"$699",
image:"https://images.unsplash.com/photo-1512499617640-c74ae3a79d37?q=80&w=1000&auto=format&fit=crop",
details:"Gaming smartphone with ultra fast charging.",
buy:"https://www.amazon.com/s?k=realme+gt+6"
},

{
name:"Vivo X100 Pro",
brand:"Vivo",
price:"$999",
image:"https://images.unsplash.com/photo-1565849904461-04a58ad377e0?q=80&w=1000&auto=format&fit=crop",
details:"Professional ZEISS camera smartphone.",
buy:"https://www.amazon.com/s?k=vivo+x100+pro"
},

{
name:"Oppo Find X7 Ultra",
brand:"Oppo",
price:"$1199",
image:"https://images.unsplash.com/photo-1580910051074-3eb694886505?q=80&w=1000&auto=format&fit=crop",
details:"Premium Oppo flagship with amazing display.",
buy:"https://www.amazon.com/s?k=oppo+find+x7+ultra"
},

{
name:"Infinix GT 20 Pro",
brand:"Infinix",
price:"$399",
image:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=1000&auto=format&fit=crop",
details:"RGB gaming smartphone with strong battery.",
buy:"https://www.amazon.com/s?k=infinix+gt+20+pro"
},

{
name:"Tecno Camon 30",
brand:"Tecno",
price:"$299",
image:"https://images.unsplash.com/photo-1605236453806-6ff36851218e?q=80&w=1000&auto=format&fit=crop",
details:"Budget smartphone with camera features.",
buy:"https://www.amazon.com/s?k=tecno+camon+30"
}

];

/* AUTO CREATE MORE MOBILES */

const extraBrands = [
"iPhone",
"Samsung",
"Xiaomi",
"Realme",
"Vivo",
"Oppo",
"Infinix",
"Tecno"
];

const brandImages = {

iPhone:
"https://images.unsplash.com/photo-1695048133142-1a20484d2569?q=80&w=1000&auto=format&fit=crop",

Samsung:
"https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?q=80&w=1000&auto=format&fit=crop",

Xiaomi:
"https://images.unsplash.com/photo-1598327105666-5b89351aff97?q=80&w=1000&auto=format&fit=crop",

Realme:
"https://images.unsplash.com/photo-1512499617640-c74ae3a79d37?q=80&w=1000&auto=format&fit=crop",

Vivo:
"https://images.unsplash.com/photo-1565849904461-04a58ad377e0?q=80&w=1000&auto=format&fit=crop",

Oppo:
"https://images.unsplash.com/photo-1580910051074-3eb694886505?q=80&w=1000&auto=format&fit=crop",

Infinix:
"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=1000&auto=format&fit=crop",

Tecno:
"https://images.unsplash.com/photo-1605236453806-6ff36851218e?q=80&w=1000&auto=format&fit=crop"

};

for(let i = 1; i <= 142; i++){

let brand = extraBrands[i % extraBrands.length];

mobiles.push({

name: brand + " Model " + i,

brand: brand,

price: "$" + (300 + i),

image: brandImages[brand],

details:
"Premium smartphone with stylish design, powerful battery, smooth display and advanced camera features.",

buy:
"https://www.amazon.com/s?k=" + encodeURIComponent(brand + " phone")

});

}

/* SHOW MOBILES */

const grid = document.getElementById("mobileGrid");

function showMobiles(data){

grid.innerHTML="";

data.forEach(mobile=>{

grid.innerHTML += `

<div class="mobile-card"
onclick="showDetails(
'${mobile.name}',
'${mobile.price}',
'${mobile.image}',
'${mobile.details}',
'${mobile.buy}'
)">

<img src="${mobile.image}">

<h2>${mobile.name}</h2>

<p>${mobile.price}</p>

</div>

`;

});

}

showMobiles(mobiles);

/* SEARCH */

document.getElementById("searchInput")
.addEventListener("input", function(){

let value = this.value.toLowerCase();

let filtered = mobiles.filter(mobile =>

mobile.name.toLowerCase().includes(value)

);

showMobiles(filtered);

});

/* FILTER */

function filterBrand(brand){

if(brand === "All"){

showMobiles(mobiles);

return;

}

let filtered = mobiles.filter(mobile =>

mobile.brand === brand

);

showMobiles(filtered);

}

/* DETAILS */

function showDetails(name,price,image,details,buy){

document.getElementById("detailsPage").style.display="block";

document.getElementById("detailsBox").innerHTML = `

<h1>${name}</h1>

<img src="${image}">

<h2>${price}</h2>

<p>${details}</p>

<a href="${buy}" target="_blank" class="buy-btn">
Buy Now
</a>

`;

}

/* CLOSE */

function closeDetails(){

document.getElementById("detailsPage").style.display="none";

}

</script>

</body>
</html>
